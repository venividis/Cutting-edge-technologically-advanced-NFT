name: Apply verified utility source
on:
  push:
    branches: [fix/utility-workflows-20260904]
    paths: ['.github/utility-payload/**', '.github/workflows/utility-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'venividis/Cutting-edge-technologically-advanced-NFT' && github.ref == 'refs/heads/fix/utility-workflows-20260904'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify and apply exact source and clean-build evidence
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/utility-workflows-20260904'
          git diff --name-only 80312cdb27d2a87fe12afee3b953463d48f37328 HEAD > /tmp/preparation-paths.txt
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('/tmp/preparation-paths.txt').read_text().splitlines():
              assert p == '.github/workflows/utility-apply.yml' or p.startswith('.github/utility-payload/'), p
          PY
          cat .github/utility-payload/{00,01,02,03,04,05}.part > /tmp/utility-source.patch.xz
          echo 'bbe8f97b5ce2df24e37d285f1c76297ac0160f5d466dc6a6c0cda93aaaae4a41  /tmp/utility-source.patch.xz' | sha256sum -c -
          xz -dc /tmp/utility-source.patch.xz > /tmp/utility-source.patch
          echo '94d37714f593b1394d0e347ece56f7004cdbf6a9b09cd0b880cabc0bee1d2ef4  /tmp/utility-source.patch' | sha256sum -c -
          git apply --check /tmp/utility-source.patch
          git apply --index /tmp/utility-source.patch
          echo '450dc48c76e2563306ab996bb2e7b0dcb1a09ef22b5b1a12bf1b9046a21bdbf1  .github/utility-payload/06-clean.part' | sha256sum -c -
          xz -dc .github/utility-payload/06-clean.part > /tmp/utility-clean.patch
          echo '87f1466ca969e816dc7463c2ba176db87938e625f79e0bc79521617efc5af942  /tmp/utility-clean.patch' | sha256sum -c -
          git apply --check /tmp/utility-clean.patch
          git apply --index /tmp/utility-clean.patch
      - name: Install locked dependencies and regenerate exact ABI
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx hardhat build
          node scripts/utility-abi.mjs
          echo 'fac59b265d367d2fd27469a05b13c57cca6cf413342c4753d8a8582a2b77fab7  src/utility/abi.js' | sha256sum -c -
          git add src/utility/abi.js
      - name: Verify both protocol implementations
        run: |
          set -o pipefail
          npm run test:both | tee /tmp/utility-contract-tests.log
          node scripts/commons-check.mjs
          git diff --exit-code -- src/commons/abi.js src/utility/abi.js docs/utility/runtime-sizes.json
      - name: Reproduce the exact browser-tested application
        run: |
          npm run ui:build
          node scripts/commons-preview.mjs dist/ANIMA_Sanctuary_3D.html
          node scripts/utility-preview.mjs dist/ANIMA_Utility.html
          echo '6793ec26456bc38cc5dd0a3fe2506df57d900ab7c06c22c2185320a6448c582b  dist/ANIMA_Utility.html' | sha256sum -c -
      - name: Publish readable source only to correction branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm -r .github/utility-payload .github/workflows/utility-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: complete Swap Launch Vault and funded-work GUI workflows'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fix/utility-workflows-20260904
          git rev-parse HEAD > /tmp/utility-reviewed-commit.txt
          git archive --format=tar.gz HEAD > /tmp/utility-reviewed-source.tgz
      - name: Preserve fingerprint diagnostics even on failure
        if: always()
        run: |
          mkdir -p /tmp/utility-diagnostics
          cp src/utility/abi.js /tmp/utility-diagnostics/abi.js 2>/dev/null || true
          cp artifacts/contracts/market/AgentLaunchpad.sol/AgentLaunchpad.json /tmp/utility-diagnostics/AgentLaunchpad.json 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: utility-reviewed-source
          path: |
            /tmp/utility-contract-tests.log
            /tmp/utility-reviewed-commit.txt
            /tmp/utility-reviewed-source.tgz
            /tmp/utility-diagnostics/
            dist/
          retention-days: 7
