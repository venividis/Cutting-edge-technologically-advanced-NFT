name: Apply verified Sanctuary source
on:
  push:
    branches: [upgrade/sanctuary-commons-3d-20260904]
    paths: ['.github/commons-payload/**', '.github/workflows/commons-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'venividis/Cutting-edge-technologically-advanced-NFT' && github.ref == 'refs/heads/upgrade/sanctuary-commons-3d-20260904'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify exact source patch before applying
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/upgrade/sanctuary-commons-3d-20260904'
          git diff --name-only fe1b493d14feba77a714fc6b35cf0c25d5db192e HEAD > /tmp/preparation-paths.txt
          python3 - <<'PY'
          from pathlib import Path
          allowed = {'.github/workflows/commons-apply.yml', '.github/workflows/commons-validation.yml'}
          for p in Path('/tmp/preparation-paths.txt').read_text().splitlines():
              assert p in allowed or p.startswith('.github/commons-payload/'), p
          PY
          cat .github/commons-payload/{00,01,02,03,04,05}.part > /tmp/commons-source.patch.xz
          echo 'cd12506190e106c78ba7fe1220869fa1596cefa111219d7e2603475e8e6e63a4  /tmp/commons-source.patch.xz' | sha256sum -c -
          xz -dc /tmp/commons-source.patch.xz > /tmp/commons-source.patch
          echo 'd4c7752ae5a577ed0e0ccfcff939ae2cf748ff5aa5765876086d18f50a5de9f3  /tmp/commons-source.patch' | sha256sum -c -
          git apply --check /tmp/commons-source.patch
          git apply --index /tmp/commons-source.patch
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test both implementations
        run: |
          set -o pipefail
          npm run test:both | tee /tmp/commons-contract-tests.log
      - name: Verify ABI, runtime limits, and application build
        run: |
          node scripts/commons-check.mjs
          git diff --exit-code -- src/commons/abi.js
          npm run ui:build
          node scripts/commons-preview.mjs dist/ANIMA_Sanctuary_3D.html
      - name: Publish verified visible source only to upgrade branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm -r .github/commons-payload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: Sanctuary 3D and consent-first Commons social layer'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/upgrade/sanctuary-commons-3d-20260904
          git rev-parse HEAD > /tmp/anima-reviewed-commit.txt
          git archive --format=tar.gz HEAD > /tmp/anima-reviewed-source.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commons-reviewed-source
          path: |
            /tmp/commons-contract-tests.log
            /tmp/anima-reviewed-commit.txt
            /tmp/anima-reviewed-source.tgz
            dist/
          retention-days: 7
